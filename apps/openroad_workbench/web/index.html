<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenROAD Workbench</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><strong>OpenROAD</strong> Workbench</div>
  <div class="top-item"><span class="k">设计</span><button id="design-btn" class="link">—</button></div>
  <div class="top-item"><span class="k">终端</span><button id="session-btn" class="link">—</button></div>
  <div class="top-item"><span class="k">运行</span><span id="run-text" class="v">—</span></div>
  <div class="top-item"><span class="k">状态</span><span id="status-pill" class="pill idle">IDLE</span></div>
  <div class="spacer"></div>
  <div class="top-item"><span class="k">cwd</span><span id="cwd-text" class="v mono">—</span></div>
  <div class="top-item"><span class="k">pid</span><span id="pid-text" class="v mono">—</span></div>
  <div class="top-item"><span class="k">MCP</span><span id="mcp-text" class="v">—</span></div>
  <button id="btn-refresh" class="ghost">刷新</button>
  <button id="btn-new-session" class="ghost">新建终端</button>
</header>

<main>
  <section id="col-design" class="panel">
    <div class="panel-head">
      <span>DESIGN</span>
      <span class="head-actions"><button id="btn-add-design" class="mini">+ 登记目录</button></span>
    </div>
    <div id="tree" class="panel-body"></div>
    <div id="add-design" class="panel-foot hidden">
      <input id="design-path" class="input" placeholder="/path/to/design">
      <button id="btn-do-add-design" class="mini">登记</button>
    </div>
  </section>

  <section id="col-run" class="panel">
    <div class="panel-head">
      <span>LIVE RUN / TERMINAL</span>
      <span class="head-actions">
        <button id="btn-interrupt" class="mini danger">中断 Ctrl-C</button>
        <button id="btn-new-session-2" class="mini">新建终端</button>
      </span>
    </div>
    <div id="timeline" class="timeline"></div>
    <pre id="terminal" class="term" tabindex="0"></pre>
    <div class="term-hint">终端画面由服务端渲染，只读；命令在 TUI 里执行。下方 <b>发送到 TUI</b> 可把内容放进终端输入栏。</div>
  </section>

  <section id="col-inspector" class="panel">
    <div class="panel-head"><span>INSPECTOR</span><span id="inspector-kind" class="muted"></span></div>
    <div id="inspector" class="panel-body"></div>
  </section>
</main>

<section id="bottom" class="panel">
  <div class="tabs">
    <button class="tab active" data-mode="log">日志</button>
    <button class="tab" data-mode="report">报告</button>
    <button class="tab" data-mode="image">图像</button>
    <button class="tab" data-mode="metric">指标</button>
    <button class="tab" data-mode="script">脚本</button>
    <button class="tab" data-mode="data">设计数据</button>
    <button class="tab" data-mode="events">事件流</button>
    <button class="tab" data-mode="tools">MCP 工具</button>
    <div class="spacer"></div>
    <span id="bottom-title" class="muted">—</span>
  </div>
  <div id="bottom-body" class="bottom-body"></div>
</section>

<script src="/static/app.js"></script>
</body>
</html>
