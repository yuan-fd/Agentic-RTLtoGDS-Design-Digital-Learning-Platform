<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OpenROAD MCP App</title><link rel="stylesheet" href="/static/app.css"></head><body><header><div class="brand"><strong>OpenROAD MCP</strong><span>Interactive physical-design workspace</span></div><nav><button data-page="home">首页</button><button data-page="session">Interactive Session</button><button data-page="reports">Reports</button></nav><span id="health">连接检查中…</span></header><main><section id="home" class="page active"><p class="eyebrow">MCP workspace</p><h1>OpenROAD 的清晰入口</h1><p class="lead">把 Session、报告和运行状态分开，让每一步都能看懂。</p><div class="home-grid"><button class="launch" data-page="session"><b>Interactive Session</b><small>打开 OpenROAD 交互终端，执行只读查询并查看输出。</small></button><button class="launch" data-page="reports"><b>Reports</b><small>按 platform、design 和 run 查看 ORFS 报告图。</small></button></div><div class="status" id="homeStatus"></div></section><section id="session" class="page"><div class="heading"><div><p class="eyebrow">01 · Interactive Session</p><h2>OpenROAD 交互会话</h2></div><button class="button" id="refreshSessions">刷新</button></div><div class="toolbar"><button class="button primary" id="createSession">新建 Session</button><select id="sessionSelect" aria-label="选择 Session"><option value="">选择一个 Session</option></select><button class="button" id="inspectSession">查看详情</button></div><div class="terminal"><div class="terminal-head">只读查询</div><div class="query"><input id="command" value="report_design_area" aria-label="OpenROAD query"><button class="button primary" id="runQuery">执行查询</button></div><pre id="output">选择 Session 或直接运行安全查询。</pre></div></section><section id="reports" class="page"><div class="heading"><div><p class="eyebrow">02 · Reports</p><h2>ORFS 报告图</h2></div></div><div class="form-grid"><label>Platform<input id="platform" value="sky130hd"></label><label>Design<input id="design" value="ibex"></label><label>Run<input id="run" value="base"></label><button class="button primary" id="listReports">列出报告图</button></div><div id="reportList" class="report-list"></div><figure id="preview" hidden><img><figcaption></figcaption></figure></section></main><script src="/static/app.js"></script></body></html>
