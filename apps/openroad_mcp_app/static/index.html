<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OpenROAD MCP App</title><link rel="stylesheet" href="/static/app.css"></head><body><header><a href="#home" class="brand"><strong>OpenROAD MCP</strong><span>Physical-design workspace</span></a><nav><button data-page="home">首页</button><button data-page="sessions">Sessions</button><button data-page="reports">Reports</button><button data-page="runs">ORFS Runs</button><button data-page="tools">Tools</button></nav><span id="health">检查中…</span></header><main><section id="home" class="page active"><p class="eyebrow">Standalone MCP app</p><h1>把 OpenROAD 工具分开看</h1><p class="lead">Session、报告、ORFS 任务和工具目录各自有清晰入口。</p><div class="home-grid"><button class="launch" data-page="sessions"><b>Interactive Sessions</b><small>创建、查看、查询和结束 OpenROAD 会话。</small></button><button class="launch" data-page="reports"><b>Reports & Images</b><small>查看 ORFS 阶段报告图和图像元数据。</small></button><button class="launch" data-page="runs"><b>ORFS Runs</b><small>启动阶段、查看任务状态和取消任务。</small></button><button class="launch" data-page="tools"><b>All MCP Tools</b><small>查看官方工具、参数和读写权限。</small></button></div><div class="status" id="homeStatus"></div></section><section id="sessions" class="page"><div class="heading"><div><p class="eyebrow">01 · Interactive Sessions</p><h2>交互式 OpenROAD 会话</h2></div><button class="button" id="refreshSessions">刷新 Session</button></div><div class="toolbar"><button class="button primary" id="createSession">新建 Session</button><select id="sessionSelect" aria-label="选择 Session"><option value="">选择 Session</option></select><button class="button" id="inspectSession">查看详情</button><button class="button" id="historySession">命令历史</button><button class="button danger" id="terminateSession">结束 Session</button></div><div class="terminal"><div class="terminal-head">OpenROAD 命令</div><div class="query"><input id="command" value="report_design_area" aria-label="OpenROAD command"><button class="button primary" id="runQuery">执行查询</button><button class="button warning" id="runExec">执行修改命令</button></div><pre id="output">选择 Session 或直接运行安全查询。</pre></div></section><section id="reports" class="page"><div class="heading"><div><p class="eyebrow">02 · Reports</p><h2>ORFS 报告图</h2></div></div><div class="form-grid"><label>Platform<input id="platform" value="sky130hd"></label><label>Design<input id="design" value="ibex"></label><label>Run<input id="run" value="base"></label><button class="button primary" id="listReports">列出报告图</button></div><div id="reportList" class="report-list"></div><figure id="preview" hidden><img><figcaption></figcaption></figure></section><section id="runs" class="page"><div class="heading"><div><p class="eyebrow">03 · ORFS Runs</p><h2>ORFS 任务</h2></div></div><div class="form-grid"><label>Platform<input id="runPlatform" value="sky130hd"></label><label>Design<input id="runDesign" value="ibex"></label><label>Stage<input id="runStage" value="synth"></label><button class="button primary" id="startRun">启动阶段</button></div><div class="status" id="runOutput">任务状态会显示在这里。</div></section><section id="tools" class="page"><div class="heading"><div><p class="eyebrow">04 · Tool Catalog</p><h2>官方 MCP 工具目录</h2></div><button class="button" id="refreshTools">刷新目录</button></div><div class="tool-runner"><label>选择工具<select id="toolSelect"></select></label><label>JSON 参数<textarea id="toolArgs" rows="5">{}</textarea></label><button class="button primary" id="callTool">调用工具</button><pre id="toolOutput">选择工具后调用。</pre></div><div id="toolList" class="tool-list"></div></section></main><script src="/static/app.js"></script></body></html>
