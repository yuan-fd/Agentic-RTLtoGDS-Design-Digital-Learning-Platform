[build-system]
requires = ["setuptools>=59.4"]
build-backend = "setuptools.build_meta"

[project]
name = "openroad-app-m2-rtl-comparison"
version = "0.1.0"
description = "Independent Direct LLM versus RTLScout teaching module"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
openroad-m2 = "openroad_app_m2.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openroad_app_m2*"]
