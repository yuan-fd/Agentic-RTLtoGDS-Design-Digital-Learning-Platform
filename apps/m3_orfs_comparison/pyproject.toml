[build-system]
requires = ["setuptools>=59.4"]
build-backend = "setuptools.build_meta"

[project]
name = "openroad-app-m3-orfs-comparison"
version = "0.1.0"
description = "Independent ORFS baseline versus ORFS-Agent teaching module"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
openroad-m3 = "openroad_app_m3.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openroad_app_m3*"]
