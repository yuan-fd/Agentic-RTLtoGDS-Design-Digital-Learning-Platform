[build-system]
requires = ["setuptools>=59.4"]
build-backend = "setuptools.build_meta"

[project]
name = "openroad-app-m4-script-lab"
version = "0.1.0"
description = "Independent allowlisted Tcl/Python recipe scripting lab"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
openroad-m4 = "openroad_app_m4.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openroad_app_m4*"]
