name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Python compile check
        run: |
          python -m compileall -q apps packages tests

      - name: JavaScript syntax check
        run: node --check apps/m1_rtl_to_gds/web/app.js

      - name: Unit tests
        run: |
          python -m pytest -q --no-header -x
        env:
          # Local loopback socket tests are allowed on CI runners.
          OPENROAD_PLATFORM_CI: "1"

  # Note: real EDA runs (2D ORFS / TaiWei 3D) require the pinned ARM64
  # toolchains and are executed on the internal server, not in CI.
  # This job only guards code-level quality.
