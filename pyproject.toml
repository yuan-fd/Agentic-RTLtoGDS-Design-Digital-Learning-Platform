[build-system]
requires = ["setuptools>=59.4"]
build-backend = "setuptools.build_meta"

[project]
name = "openroad-platform"
version = "0.1.0"
description = "Teaching contracts and independent Agentic RTL-to-GDS modules"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["packages/contracts/src"]
include = ["openroad_platform_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/contracts/src", "apps/m1_rtl_to_gds/src"]
addopts = "-ra"
markers = [
  "real_3d: real TaiWei 3D end-to-end flow (needs pinned toolchain)",
]
